# Publishes this static site to GitHub Pages (no build step).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only what the browser needs; dev tooling and docs stay in the repo.
      - name: Prepare Pages output
        run: |
          mkdir -p _site
          rsync -a --exclude '.git*' --exclude '.github' --exclude '_site' --exclude 'tools' --exclude 'docs' --exclude 'PROJECT_ANALYSIS.md' --exclude 'README.md' ./ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
