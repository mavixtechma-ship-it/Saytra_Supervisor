<body>
<a href="#view" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:m-2 btn btn-sm">Skip to content</a>
<div class="drawer lg:drawer-open">
  <input id="nav-toggle" type="checkbox" class="drawer-toggle" aria-label="Toggle navigation">

  <div class="drawer-content flex flex-col min-h-screen min-w-0">
    <header class="sticky top-0 z-30 bg-base-100/90 backdrop-blur border-b border-base-300">
      <div class="flex items-center gap-3 px-4 lg:px-8 h-16">
        <label for="nav-toggle" class="btn btn-ghost btn-sm btn-square lg:hidden" aria-label="Open navigation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </label>
        <div class="flex-1 min-w-0">
          <p id="topbar-section" class="text-xs rw-muted font-semibold uppercase tracking-wider">Planning</p>
          <p id="topbar-title" class="font-extrabold truncate">Overview</p>
        </div>
        <span id="week-tag" class="badge badge-outline badge-primary font-semibold hidden sm:inline-flex"></span>
        <span id="role-tag" class="badge badge-accent font-semibold hidden">Read-only</span>
        <button type="button" class="btn btn-ghost btn-sm btn-square" data-theme-toggle aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <div class="dropdown dropdown-end">
          <div tabindex="0" role="button" class="btn btn-ghost btn-sm gap-2 px-1" aria-label="Account menu">
            <span id="user-avatar" class="w-8 h-8 rounded-full bg-primary text-primary-content grid place-items-center text-xs font-bold"></span>
          </div>
          <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-40 w-60 p-2 shadow-lg border border-base-300 mt-2">
            <li class="menu-title"><span id="user-name"></span><span id="user-role" class="text-xs font-normal rw-muted"></span></li>
            <li id="reset-item" class="hidden"><button type="button" id="reset-data">Reset demo edits</button></li>
            <li><button type="button" id="sign-out">Sign out</button></li>
          </ul>
        </div>
      </div>
    </header>
    <main id="view" class="flex-1 w-full max-w-[1440px] mx-auto p-4 lg:p-8" tabindex="-1" aria-live="polite"></main>
    <footer class="px-4 lg:px-8 py-4 text-xs rw-muted border-t border-base-300 flex flex-wrap gap-2 justify-between">
      <span>RouteWise · portfolio demo · fictional data</span>
      <span id="data-source"></span>
    </footer>
  </div>

  <div class="drawer-side z-40">
    <label for="nav-toggle" class="drawer-overlay" aria-label="Close navigation"></label>
    <aside class="rw-sidebar w-64 min-h-full flex flex-col">
      <a href="#/dashboard" class="flex items-center gap-3 px-5 h-16 border-b border-white/10">

      </a>
      <nav class="rw-nav flex-1 px-3 py-2 overflow-y-auto" aria-label="Main">
        <div class="rw-nav-group">Planning</div>
        <a href="#/dashboard" data-nav="dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</a>
        <a href="#/plans" data-nav="plans"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Journey Plans<span id="nav-count-plans" class="badge badge-sm ms-auto bg-white/15 border-0 text-white"></span></a>
        <a href="#/markets" data-nav="markets"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Markets</a>
        <a href="#/supervisors" data-nav="supervisors"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Supervisors</a>
        <a href="#/routes" data-nav="routes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/></svg>Routes</a>
        <div class="rw-nav-group">Monitoring</div>
        <a href="#/visits" data-nav="visits"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Live Visits<span id="nav-count-live" class="badge badge-sm badge-accent ms-auto"></span></a>
        <a href="#/reports" data-nav="reports"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Reports</a>
        <a href="#/kpi" data-nav="kpi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>KPI Tasks</a>
        <div class="rw-nav-group">System</div>
        <a href="#/model" data-nav="model"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>Data Model</a>
      </nav>
      <div class="p-4 border-t border-white/10 text-xs text-white/60">
        <p id="side-city"></p>
      </div>
    </aside>
  </div>
</div>
